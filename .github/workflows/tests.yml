name: .NET Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Chuds2Chads.sln

      - name: Build
        run: dotnet build Chuds2Chads.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test --project Chuds2Chads.Tests/Chuds2Chads.Tests.csproj --configuration Release --no-build
