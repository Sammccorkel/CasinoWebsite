name: Backend Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Chuds2Chads.sln

      - name: Build solution
        run: dotnet build Chuds2Chads.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --project Chuds2Chads.Tests/Chuds2Chads.Tests.csproj --configuration Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
